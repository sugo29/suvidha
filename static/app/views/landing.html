<div class="landing-container" ng-controller="AuthController" ng-cloak>
    <!-- Hero Section -->
    <div class="landing-hero">
        <div class="hero-content">
            <div class="logo-section">
                <div class="logo">
                    <div class="logo-icon">
                        <i class="fas fa-city"></i>
                    </div>
                    <div class="logo-text">Suvidha</div>
                </div>
                <p class="tagline">Manage Your Utilities Smartly</p>
            </div>
            
            <div class="hero-text">
                <h1 class="hero-title">Welcome to Suvidha</h1>
                <p class="hero-subtitle">Track bills, manage connections, and get personalized insights for your utilities - all in one place</p>
                
                <div class="features-list">
                    <div class="feature-item">
                        <i class="fas fa-bolt"></i>
                        <span>Track All Bills in One Place</span>
                    </div>
                    <div class="feature-item">
                        <i class="fas fa-chart-line"></i>
                        <span>Get Cost-Saving Tips</span>
                    </div>
                    <div class="feature-item">
                        <i class="fas fa-shield-alt"></i>
                        <span>Secure Your Account</span>
                    </div>
                </div>
                
                <div class="cta-buttons">
                    <button class="primary-btn" 
                            ng-click="goToSignup()">
                        Create Account
                    </button>
                    <button class="secondary-btn" 
                            ng-click="goToLogin()">
                        Log In
                    </button>
                </div>
            </div>
        </div>
        
        <div class="hero-image">
            <div class="illustration">
                <i class="fas fa-tasks"></i>
            </div>
        </div>
    </div>
    
    <!-- Language Selector -->
    <div class="language-selector">
        <button class="lang-btn" 
                ng-class="{active: currentLang === 'en'}"
                ng-click="setLanguage('en')">EN</button>
        <button class="lang-btn" 
                ng-class="{active: currentLang === 'hi'}"
                ng-click="setLanguage('hi')">हिंदी</button>
    </div>
</div>
